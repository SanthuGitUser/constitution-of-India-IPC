# Builds the Vite app and pushes static files to the `gh-pages` branch.
# Pages setup: Repo → Settings → Pages → Deploy from branch → gh-pages / / (root)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify site output
        run: |
          test -f web/dist/index.html || (echo "Missing index.html — build failed" && exit 1)

      - name: SPA fallback (subpath refresh)
        run: cp web/dist/index.html web/dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          force_orphan: true
