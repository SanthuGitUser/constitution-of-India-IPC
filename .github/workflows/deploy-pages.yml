# Builds the Vite app and pushes static files to the `gh-pages` branch.
#
# REQUIRED on GitHub:
#   Settings → Actions → General → Workflow permissions → "Read and write permissions"
#   (Otherwise the workflow cannot create/update the gh-pages branch.)
#
# REQUIRED for the live URL:
#   Settings → Pages → Build and deployment → Source: "Deploy from a branch"
#   Branch: gh-pages  /  Folder: / (root)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Default token must be allowed to push to gh-pages (repo setting above).
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify site output
        run: |
          test -f web/dist/index.html || (echo "Missing index.html — build failed" && exit 1)
          echo "--- Built files (first 30) ---"
          ls -la web/dist | head -30

      - name: SPA fallback (refresh on subpaths)
        run: cp web/dist/index.html web/dist/404.html

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web/dist
          clean: true

      - name: Reminder (read in Actions log)
        run: |
          echo "::notice::If the site shows 404, set: Repo Settings → Pages → Deploy from branch → gh-pages / (root). Also enable Workflow permissions Read and write."
