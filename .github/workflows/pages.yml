# Builds the Vite app → docs/ and deploys via GitHub’s official Pages action.
#
# REQUIRED after first successful run:
#   Settings → Pages → Build and deployment → Source: “GitHub Actions”
#   (NOT “Deploy from a branch” — that would ignore this deploy.)

name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build (writes ../docs)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify output
        run: |
          test -f docs/index.html || (echo "docs/index.html missing" && exit 1)
          cp docs/index.html docs/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
