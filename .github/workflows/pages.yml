# Builds the site and deploys to the gh-pages branch.
# You do NOT need to commit the docs/ folder when this workflow is enabled.
#
# After the first green run:
#   Settings → Pages → Source: Deploy from a branch
#   Branch: gh-pages  /  Folder: / (root)

name: Publish GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build (outputs to docs/)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify index.html exists
        run: test -f docs/index.html

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: docs
          clean: true
